name: Knowledge base refresh

# Re-reads every source in scripts/kb/sources.ts (e-Laws acts and regulations, LTB rules and
# interpretation guidelines, the standard-lease guide, the rent-guideline page, OHRC, RentSafeTO).
# A source whose text is unchanged only gets its fetched_at touched; a changed one becomes a NEW
# version (embedded, previous version marked superseded — never deleted). The assistant cites
# whichever version is current. design/rag-knowledge-base-plan-2026-10-27.md §7.
#
# TRIGGERS ARE DELIBERATELY LIMITED: this repo is public and the job holds the service-role key.
# `schedule` + `workflow_dispatch` only — never `pull_request`, `pull_request_target`, `issue_comment`.
on:
  schedule:
    # Mondays 06:30 UTC — e-Laws consolidations land on weekdays; a weekly pass keeps the lag ≤ 7 days.
    - cron: '30 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fetch and report without writing'
        type: boolean
        default: false
      only:
        description: 'One source key (empty = all)'
        type: string
        default: ''

concurrency:
  group: kb-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh the knowledge base
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://uotcczsfeiptnabamzcd.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # New versions are embedded with gemini-embedding-001; without this key a changed source
          # cannot be stored (the run fails loudly rather than storing passages the search cannot see).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "$GEMINI_API_KEY" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "::error::GEMINI_API_KEY is not set. From a checkout: grep '^GEMINI_API_KEY=' .env.local | cut -d= -f2- | gh secret set GEMINI_API_KEY"
            exit 1
          fi
          ./node_modules/.bin/tsx scripts/kb/ingest.ts ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.only && format('--only={0}', inputs.only) || '' }}
