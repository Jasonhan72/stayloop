  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

,185,129,0.32);\n\n  /* Status */\n  --sl-success:        #16A34A;\n  --sl-warning:        #D97706;\n  --sl-danger:         #DC2626;\n  --sl-info:           #2563EB;\n  --sl-trust:          #7C3AED;   /* Trust API + Passport + Mediator only */\n\n  /* Tier badges */\n  --sl-tier-approve-bg:  #DCFCE7;  --sl-tier-approve-fg:  #16A34A;\n  --sl-tier-cond-bg:     #FEF3C7;  --sl-tier-cond-fg:     #D97706;\n  --sl-tier-decline-bg:  #FEE2E2;  --sl-tier-decline-fg:  #DC2626;\n  --sl-tier-pending-bg:  #E0DACE;  --sl-tier-pending-fg:  #71717A;\n\n  /* Type */\n  --sl-font-sans:    'Inter Tight', system-ui, -apple-system, sans-serif;\n  --sl-font-cn:      'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;\n  --sl-font-mono:    'JetBrains Mono', ui-monospace, monospace;\n\n  /* Radius */\n  --sl-r-sm: 4px; --sl-r-md: 6px; --sl-r-lg: 8px; --sl-r-xl: 12px; --sl-r-pill: 999px;\n\n  /* Shadows */\n  --sl-sh-sm: 0 1px 2px rgba(0,0,0,0.04);\n  --sl-sh-md: 0 1px 3px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);\n  --sl-sh-lg: 0 4px 8px rgba(0,0,0,0.06), 0 12px 32px rgba(0,0,0,0.06);\n  --sl-sh-card: 0 1px 3px rgba(31,25,11,0.04), 0 12px 32px -8px rgba(31,25,11,0.06);\n\n  /* Widths */\n  --sl-w-narrow: 720px;\n  --sl-w-default: 1100px;\n  --sl-w-wide: 1260px;\n}\n\n* { box-sizing: border-box; }\nhtml, body { font-family: var(--sl-font-sans); color: var(--sl-text); }\n\n/* Primary CTA — soft mint gradient */\n.sl-cta {\n  background: linear-gradient(135deg, #6EE7B7 0%, #34D399 100%);\n  color: #FFFFFF;\n  box-shadow: 0 8px 22px -10px rgba(52,211,153,0.45),\n              0 1px 0 rgba(255,255,255,0.30) inset;\n  border-radius: 10px;\n  padding: 12px 22px;\n  font-size: 15px; font-weight: 600;\n  border: none; cursor: pointer;\n  font-family: var(--sl-font-sans);\n}\n.sl-cta:disabled, .sl-cta.disabled { background: #C5BDAA; color: #71717A; cursor: not-allowed; box-shadow: none; }\n\n/* Secondary outlined */\n.sl-btn-2 {\n  background: #FFFFFF;\n  border: 1px solid var(--sl-border-strong);\n  color: var(--sl-text);\n  border-radius: 10px;\n  padding: 11px 20px;\n  font-size: 14px; font-weight: 600;\n  cursor: pointer;\n  font-family: var(--sl-font-sans);\n}\n\n/* Ghost text */\n.sl-btn-3 {\n  background: transparent; border: none;\n  color: var(--sl-brand); font-weight: 600; cursor: pointer;\n  font-family: var(--sl-font-sans);\n}\n\n/* Card */\n.sl-card {\n  background: #FFFFFF;\n  border: 1px solid var(--sl-border);\n  border-radius: 14px;\n  box-shadow: var(--sl-sh-card);\n}\n\n/* Input */\n.sl-input {\n  background: #FFFFFF;\n  border: 1px solid var(--sl-border);\n  border-radius: 10px;\n  padding: 11px 14px;\n  height: 44px;\n  font-size: 14px;\n  color: #0B1736;\n  caret-color: #0B1736;\n  font-family: var(--sl-font-sans);\n}\n.sl-input:focus {\n  outline: none;\n  border-color: var(--sl-brand);\n  box-shadow: 0 0 0 3px rgba(4,120,87,0.15);\n}\n\n/* Eyebrow */\n.sl-eyebrow {\n  font-size: 10.5px; font-weight: 700;\n  letter-spacing: 0.10em; text-transform: uppercase;\n  color: var(--sl-text-3);\n}\n\n/* Mono numbers */\n.sl-mono { font-family: var(--sl-font-mono); font-feature-settings: 'zero', 'ss01'; }\n\n/* Custom scroll inside cards */\n.sl-card-scroll::-webkit-scrollbar { width: 6px; height: 6px; }\n.sl-card-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }\n.sl-card-scroll::-webkit-scrollbar-track { background: transparent; }\n<\u002Fstyle>\n<style>\n  body { background: #E8E2D2; font-family: 'Inter Tight', 'Noto Sans SC', system-ui, sans-serif; margin: 0; }\n\n  .intro { max-width: 1180px; margin: 0 auto; padding: 56px 40px 24px; }\n  .intro .badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px; background: #0B0B0E; color: #fff; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; border-radius: 4px; }\n  .intro .badge .d { width: 6px; height: 6px; background: #2563EB; border-radius: 50%; }\n  .intro h1 { font-size: 48px; f 4px; overflow: hidden; box-shadow: 0 12px 36px rgba(0,0,0,0.10), 0 0 0 1px #D8D2C2; display: flex; flex-direction: column; }\n  .brz-bar { height: 36px; padding: 0 14px; display: flex; align-items: center; gap: 10px; background: #F4EFE6; border-bottom: 1px solid #E0DACE; }\n  .brz-dot { width: 11px; height: 11px; border-radius: 50%; }\n  .brz-url { flex: 1; max-width: 480px; margin: 0 auto; background: #FFF; border: 1px solid #E0DACE; border-radius: 6px; height: 22px; display: flex; align-items: center; padding: 0 10px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #71717A; gap: 8px; }\n  .brz-url .lk { color: #047857; }\n  .brz-body { flex: 1; background: #F2EEE5; }\n\n  /* Mobile frame for agent live view */\n  .mob { width: 380px; margin: 0 auto; background: #0B0B0E; border-radius: 38px; padding: 8px; box-shadow: 0 18px 50px rgba(0,0,0,0.18); position: relative; }\n  .mob-screen { background: #F2EEE5; border-radius: 30px; overflow: hidden; height: 760px; position: relative; }\n  .mob-statusbar { height: 40px; background: transparent; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; font-size: 13px; font-weight: 600; }\n\n  /* Workspace shell (reused) */\n  .ws { display: grid; grid-template-columns: 76px 1fr 320px; height: 820px; background: #F2EEE5; }\n  .ws-rail { background: #EAE5D9; border-right: 1px solid #E0DACE; padding: 18px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }\n  .ws-rail .logo-mark { width: 32px; height: 32px; border-radius: 8px; background: #047857; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: 'Inter Tight'; font-size: 16px; margin-bottom: 18px; }\n  .ws-rail .nav-i { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #71717A; font-size: 17px; cursor: pointer; }\n  .ws-rail .nav-i.active { background: #fff; color: #047857; box-shadow: 0
